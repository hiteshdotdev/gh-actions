name: Production deployement
run-name: production deployement
on: 
  push:
    branches:
      - main

jobs:
  lint-and-build-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: ls -l 
      - run: ls -l ./dist
