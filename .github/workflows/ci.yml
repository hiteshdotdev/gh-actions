name: Checking lint and build test
run-name: checking lint and build tests
on: 
  pull_request:
    branches:
      - main

jobs:
  lint-and-build-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run lint
      - run: npm run build
